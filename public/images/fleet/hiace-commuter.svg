<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGradCommuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="glassGradCommuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="240" rx="16" fill="#F8FAFC"/>
  <rect x="1" y="1" width="398" height="238" rx="15" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Ground Shadow -->
  <ellipse cx="200" cy="195" rx="165" ry="12" fill="#000000" opacity="0.12"/>
  <ellipse cx="200" cy="195" rx="140" ry="7" fill="#000000" opacity="0.18"/>

  <!-- HiAce Commuter Main Shell (Slightly more upright nose) -->
  <path d="M 52 165 L 52 110 Q 55 80 85 78 L 290 78 Q 320 80 345 105 L 358 130 Q 362 145 362 165 L 338 165 A 25 25 0 0 0 288 165 L 142 165 A 25 25 0 0 0 92 165 Z" fill="url(#bodyGradCommuter)" stroke="#94A3B8" stroke-width="2"/>

  <!-- TravelKu Signature Green & Gold Livery -->
  <path d="M 54 142 L 348 142 L 344 150 L 54 150 Z" fill="#0284C7"/>
  <path d="M 54 152 L 340 152 L 338 155 L 54 155 Z" fill="#F59E0B"/>

  <!-- Windows -->
  <rect x="64" y="86" width="50" height="38" rx="2" fill="url(#glassGradCommuter)"/>
  <rect x="120" y="86" width="60" height="38" rx="2" fill="url(#glassGradCommuter)"/>
  <rect x="186" y="86" width="60" height="38" rx="2" fill="url(#glassGradCommuter)"/>
  <path d="M 252 86 L 298 86 L 335 124 L 252 124 Z" fill="url(#glassGradCommuter)"/>

  <!-- Window Reflections -->
  <polygon points="75,88 90,88 80,122 65,122" fill="#FFFFFF" opacity="0.15"/>
  <polygon points="135,88 150,88 140,122 125,122" fill="#FFFFFF" opacity="0.15"/>
  <polygon points="200,88 215,88 205,122 190,122" fill="#FFFFFF" opacity="0.15"/>
  <polygon points="270,88 285,88 290,122 275,122" fill="#FFFFFF" opacity="0.15"/>

  <!-- Door Lines -->
  <line x1="182" y1="84" x2="182" y2="164" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="248" y1="84" x2="248" y2="164" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="190" y="132" width="12" height="4" rx="2" fill="#334155"/>
  <rect x="256" y="132" width="12" height="4" rx="2" fill="#334155"/>

  <!-- Headlight & Grill -->
  <polygon points="340,124 358,132 352,142 334,136" fill="#F8FAFC" stroke="#64748B"/>
  <rect x="338" y="145" width="22" height="12" rx="2" fill="#1E293B"/>

  <!-- Rear Light -->
  <rect x="50" y="125" width="4" height="20" rx="2" fill="#EF4444"/>

  <!-- Front Wheel -->
  <g transform="translate(313, 165)">
    <circle cx="0" cy="0" r="23" fill="#1E293B"/>
    <circle cx="0" cy="0" r="15" fill="#475569"/>
    <circle cx="0" cy="0" r="9" fill="#94A3B8"/>
    <circle cx="0" cy="0" r="3" fill="#1E293B"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Rear Wheel -->
  <g transform="translate(117, 165)">
    <circle cx="0" cy="0" r="23" fill="#1E293B"/>
    <circle cx="0" cy="0" r="15" fill="#475569"/>
    <circle cx="0" cy="0" r="9" fill="#94A3B8"/>
    <circle cx="0" cy="0" r="3" fill="#1E293B"/>
    <line x1="-12" y1="0" x2="12" y2="0" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="#CBD5E1" stroke-width="2"/>
  </g>

  <!-- Tag / Model Label -->
  <rect x="18" y="16" width="120" height="22" rx="6" fill="#E0F2FE"/>
  <text x="78" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="800" fill="#0369A1" text-anchor="middle">HIACE COMMUTER</text>
</svg>

